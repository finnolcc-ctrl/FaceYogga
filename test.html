<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <title>Face Yoga — Test harness</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow: hidden; }
    #aurora { display: none; }
    #testPanel {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-height: 55vh;
      overflow-y: auto;
      background: rgba(10,12,20,.92);
      border-top: 1px solid rgba(255,255,255,.12);
      padding: 14px 16px 24px;
      z-index: 30;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      font-size: 13px;
      color: var(--ink);
    }
    #testPanel h3 {
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #testPanel .row {
      display: grid;
      grid-template-columns: 110px 1fr 52px;
      gap: 10px;
      align-items: center;
      padding: 6px 0;
    }
    #testPanel .row label { color: var(--ink-dim); font-size: 12px; }
    #testPanel .row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-size: 12px; }
    #testPanel input[type=range] { width: 100%; accent-color: var(--accent); }
    #testPanel .btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    #testPanel button {
      padding: 8px 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: var(--ink);
      font-size: 12px;
      cursor: pointer;
    }
    #testPanel button.primary { background: var(--accent); color: #1a1a1a; border-color: transparent; }
    #testPanel button:active { transform: scale(.97); }
    #testPanel select {
      flex: 1;
      padding: 8px 10px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      color: var(--ink);
      font: inherit;
    }
    #testPanel .status {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
      padding: 10px 0 4px;
      font-size: 11px;
      color: var(--ink-mute);
    }
    #testPanel .status strong {
      display: block;
      font-size: 18px;
      color: var(--ink);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      padding-top: 2px;
    }
    #testPanel .collapse {
      background: rgba(255,255,255,.08);
      border: 0;
      color: var(--ink);
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
    }
    .screen-exercise { background: #0b1018 !important; }
    #exerciseVideo { display: none; }
    #testFace {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: .25;
      pointer-events: none;
    }
    #testPanel.collapsed .panel-body { display: none; }
    #testPanel.collapsed { max-height: 48px; }
    #phaseFillBar {
      height: 4px;
      background: rgba(255,255,255,.1);
      border-radius: 2px;
      overflow: hidden;
      margin: 2px 0;
    }
    #phaseFillBar > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #ffcf8a, #ff8a9a);
      width: 0%;
      transition: width .08s linear;
    }
  </style>
</head>
<body>

<main id="app">
  <!-- Only the exercise screen exists in test mode -->
  <section class="screen screen-exercise in-camera-mode" data-screen="exercise">
    <video id="exerciseVideo" playsinline autoplay muted></video>
    <svg id="testFace" viewBox="0 0 100 140" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="60" rx="28" ry="38" fill="#223" stroke="#334" stroke-width=".4"/>
    </svg>
    <canvas id="exerciseMesh" class="mesh-canvas mesh-canvas-soft on"></canvas>
    <div class="sticker-layer on" id="exerciseStickers" aria-hidden="true"></div>
    <div class="exercise-dim" aria-hidden="true"></div>

    <header class="topbar topbar-exercise">
      <button class="icon-btn glass-chip" id="testPause">II</button>
      <div class="session-progress">
        <span class="eyebrow"><span id="moveIndex">1</span> / 7</span>
        <div class="progress-track"><div class="progress-fill" id="sessionProgress"></div></div>
      </div>
      <button class="icon-btn glass-chip" id="testReset">↺</button>
    </header>

    <div class="exercise-body">
      <div class="phase-stage" id="phaseStage" style="display:none">
        <div class="phase-track" id="phaseTrack"></div>
        <div class="phase-visual" id="phaseVisual">
          <div class="phase-glow" id="phaseGlow"></div>
          <span class="phase-letter" id="phaseLetter"></span>
          <div class="phase-dot" id="phaseDot"></div>
        </div>
        <div class="phase-ring" id="phaseRing"></div>
      </div>
      <div class="phase-copy">
        <span class="pill" id="stageLabel">Ready</span>
        <h2 class="phase-cue" id="phaseCue">pick a move below</h2>
        <p class="phase-sub" id="phaseSub">—</p>
      </div>
      <div class="rhythm-dots" id="rhythmDots"></div>
    </div>
  </section>
</main>

<aside id="testPanel">
  <h3>
    <span>Test harness · face-free</span>
    <button class="collapse" id="testCollapse" aria-label="collapse">—</button>
  </h3>

  <div class="panel-body">
    <div class="row" style="grid-template-columns: 90px 1fr auto">
      <label>Move</label>
      <select id="testMove"></select>
      <button class="primary" id="testStart">Start</button>
    </div>

    <div class="status">
      <div>Phase<strong id="statusPhase">—</strong></div>
      <div>Match<strong id="statusMatch">0</strong></div>
      <div>Fill<strong id="statusFill">0</strong></div>
      <div>Reps<strong id="statusReps">0</strong></div>
    </div>
    <div id="phaseFillBar"><span id="phaseFillSpan"></span></div>

    <div class="row">
      <label>jawOpen (A)</label>
      <input type="range" id="sJaw" min="0" max="1" step="0.01" value="0">
      <span class="val" id="vJaw">0.00</span>
    </div>
    <div class="row">
      <label>mouthPucker (U)</label>
      <input type="range" id="sPuck" min="0" max="1" step="0.01" value="0">
      <span class="val" id="vPuck">0.00</span>
    </div>
    <div class="row">
      <label>mouthSmile (E)</label>
      <input type="range" id="sSmile" min="0" max="1" step="0.01" value="0">
      <span class="val" id="vSmile">0.00</span>
    </div>
    <div class="row">
      <label>lip Δx</label>
      <input type="range" id="sDx" min="-0.2" max="0.2" step="0.005" value="0">
      <span class="val" id="vDx">0.00</span>
    </div>
    <div class="row">
      <label>lip Δy</label>
      <input type="range" id="sDy" min="-0.15" max="0.15" step="0.005" value="0">
      <span class="val" id="vDy">0.00</span>
    </div>

    <div class="btns">
      <button id="testHoldL">Hold ← (A/E/left)</button>
      <button id="testHoldR">Hold → (U/right)</button>
      <button id="testHoldU">Hold ↑ up</button>
      <button id="testHoldD">Hold ↓ down</button>
      <button id="testRelease">Release</button>
      <button id="testForceSnap">Force snap</button>
    </div>
  </div>
</aside>

<script>window.__faceYogaTest = true;</script>
<script type="module" src="app.js"></script>
<script type="module" src="test.js"></script>
</body>
</html>
