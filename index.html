<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Face Yoga — Week 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="intro" class="screen">
    <h1>Face Yoga</h1>
    <p class="hint">Week 1 test. We will turn on the front camera and show live expression values from MediaPipe.</p>
    <p class="privacy">Video stays on your phone. Nothing is uploaded.</p>
    <button id="start" class="primary" type="button">Start camera</button>
    <p id="error" class="error" hidden></p>
    <p id="diag" class="footnote">Loading app…</p>
  </section>

  <section id="stage" class="screen" hidden>
    <video id="video" playsinline autoplay muted></video>
    <div id="status">loading…</div>
    <div id="fps">— fps</div>
    <ul id="scores" aria-label="Live blendshape scores"></ul>
  </section>

  <script>
    // Pre-flight checks visible on screen, before the module runs.
    (function diag() {
      const el = document.getElementById('diag');
      const err = document.getElementById('error');
      const parts = [];
      parts.push('Protocol: ' + location.protocol);
      parts.push('Host: ' + (location.host || '(none)'));
      parts.push('Secure: ' + (window.isSecureContext ? 'yes' : 'no'));
      parts.push('getUserMedia: ' + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'yes' : 'no'));
      el.textContent = parts.join(' | ');
      if (location.protocol === 'file:') {
        err.textContent = 'Opened as a local file. Camera needs HTTPS — open the Vercel URL instead.';
        err.hidden = false;
      } else if (!window.isSecureContext) {
        err.textContent = 'Not a secure context. Camera needs HTTPS.';
        err.hidden = false;
      }
      window.addEventListener('error', (e) => {
        err.textContent = 'Script error: ' + (e.message || e.error);
        err.hidden = false;
      });
      window.addEventListener('unhandledrejection', (e) => {
        err.textContent = 'Load error: ' + (e.reason && e.reason.message || e.reason);
        err.hidden = false;
      });
    })();
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
