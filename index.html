<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Face Yoga — Week 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="intro" class="screen">
    <h1>Face Yoga</h1>
    <p class="hint">Week 1 test. We will turn on the front camera and show live expression values from MediaPipe.</p>
    <p class="privacy">Video stays on your phone. Nothing is uploaded.</p>
    <button id="start" class="primary" type="button">Start camera</button>
    <p id="error" class="error" hidden></p>
    <p id="diag" class="footnote">Loading app…</p>
  </section>

  <section id="stage" class="screen" hidden>
    <video id="video" playsinline autoplay muted></video>
    <div id="status">loading…</div>
    <div id="fps">— fps</div>
    <ul id="scores" aria-label="Live blendshape scores"></ul>
  </section>

  <script>
    window.__appReady = false;
    (function diag() {
      const el = document.getElementById('diag');
      const err = document.getElementById('error');
      const parts = [];
      parts.push('Protocol: ' + location.protocol);
      parts.push('Host: ' + (location.host || '(none)'));
      parts.push('Secure: ' + (window.isSecureContext ? 'yes' : 'no'));
      parts.push('UA: ' + (navigator.userAgent.match(/(iPhone|Android|CrOS|Mac|Windows)/)?.[0] || 'other'));
      parts.push('getUserMedia: ' + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'yes' : 'no'));
      el.textContent = parts.join(' | ');

      function show(msg) {
        err.textContent = String(msg);
        err.hidden = false;
      }
      if (location.protocol === 'file:') show('Opened as a local file. Open the Vercel URL instead.');
      else if (!window.isSecureContext) show('Not a secure context. Camera needs HTTPS.');

      window.addEventListener('error', (e) => show('Error: ' + (e.message || e.error)), true);
      window.addEventListener('unhandledrejection', (e) => show('Load error: ' + ((e.reason && e.reason.message) || e.reason)));

      // After 5 seconds, if the module hasn't signalled ready, surface a hint.
      setTimeout(() => {
        if (!window.__appReady) {
          const existing = err.hidden ? '' : err.textContent + ' | ';
          show(existing + 'App module did not initialise within 5s — likely the MediaPipe CDN was blocked. Try a different network.');
        }
      }, 5000);
    })();
  </script>
  <script type="module" src="app.js" onerror="document.getElementById('error').textContent='Failed to load app.js';document.getElementById('error').hidden=false"></script>
</body>
</html>
