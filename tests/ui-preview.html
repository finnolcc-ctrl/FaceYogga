<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>FaceYogga · UI fixture</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="onboarding.css"></head><body><script type="module">
// Static fixture of production markup and helpers. No camera, model or stored session.
import { POSES, calibrationDiagram } from './guidance.mjs';
import { sketchReady, renderSketch, guideSketch, fitSketch, mouthBounds } from './sketch.mjs';
import { OUTER_LIP } from './mirror-feedback.mjs';
const params=new URLSearchParams(location.search);
const pose=Object.hasOwn(POSES,params.get('pose'))?params.get('pose'):'a';
const html=await (await fetch('index.html')).text();
const page=new DOMParser().parseFromString(html,'text/html');
page.querySelectorAll('script').forEach(s=>s.remove());
document.body.replaceChildren(...page.body.childNodes);
window.__faceYogaTest=true;
await import('./app.js');
const FY=window.FaceYoga;
await FY.loadRoutine();
FY.bindActions();FY.bindExerciseDialogs();
if(params.get('screen')==='calibration'){
  FY.show('calibration');
  document.getElementById('calibCue').textContent=POSES[pose].title;
  document.getElementById('calibSub').textContent=POSES[pose].detail;
  document.getElementById('calibIllustration').innerHTML=calibrationDiagram(pose);
  document.getElementById('calibStatus').textContent='Hold gently · 0.7 / 1.2 s';
  document.getElementById('calibProgress').value=.7/1.2;
} else {
  FY.show('exercise');
  const move=FY.State.routine.moves.find(m=>m.id===(pose==='e'?'vowel_e_u':pose==='a'||pose==='u'?'vowel_a_u':'pucker_side_to_side'));
  FY.State.session={moveIndex:move.order-1,moves:FY.State.routine.moves.map(m=>({id:m.id,status:'not_started'}))};
  FY.State.mode=params.get('camera')==='1'?'camera_assisted_candidate':'guided';
  FY.State.active={moveId:move.id,phase:pose};
  const screen=document.querySelector('[data-screen="exercise"]');
  screen.classList.add('is-following');
  document.getElementById('practiceHeading').textContent=move.title.en;
  document.getElementById('demoCountdown').hidden=true;
  document.getElementById('faceViewSwitch').hidden=FY.State.mode==='guided';
  FY.renderMoveGuide(move.id,pose);
  document.getElementById('phaseCue').textContent=POSES[pose].title;
  document.getElementById('phaseSub').textContent='Shape found — hold gently.';
  document.getElementById('stageLabel').textContent='Match';
  document.getElementById('moveIndex').textContent=move.order;
  FY.State.phaseGate={fill:.6,cue:'hold'};
  FY.renderHoldProgress();
  FY.renderRepDots(4,[3]);
  if(params.get('camera')==='1'){
    document.querySelector('[data-screen="exercise"]').classList.add('in-camera-mode');
    document.getElementById('sessionMode').textContent='Layout preview · no live camera';
    await sketchReady;
    const mesh=document.getElementById('exerciseMesh');
    const dpr=window.devicePixelRatio||1;
    mesh.width=mesh.clientWidth*dpr;mesh.height=mesh.clientHeight*dpr;
    const ctx=mesh.getContext('2d');ctx.scale(dpr,dpr);
    fitSketch(ctx,mesh.clientWidth,mesh.clientHeight);renderSketch(ctx,guideSketch(pose));
    FY.drawFaceFeedback(ctx,guideSketch(pose));
    mesh.classList.add('on');
    document.getElementById('liveFaceHint').hidden=true;
  }
  if(params.get('mirror')==='1') {
    const canvas=document.createElement('canvas');canvas.width=640;canvas.height=480;
    const ctx=canvas.getContext('2d');
    await sketchReady;
    let stopped=false;
    function paint(time) {
      if(stopped)return;
      ctx.fillStyle='#e7d9c4';ctx.fillRect(0,0,640,480);
      ctx.fillStyle='#c1c599';ctx.fillRect(0,0,160,480);
      ctx.fillStyle='#f2c1b8';ctx.fillRect(480,0,160,480);
      ctx.save();ctx.translate(320+Math.sin(time/1800)*8,215);
      ctx.fillStyle='#faf7ef';ctx.beginPath();ctx.ellipse(0,0,119,173,0,0,7);ctx.fill();ctx.restore();
      ctx.save();ctx.translate(160+Math.sin(time/1800)*8,0);
      const sketch=guideSketch(pose);
      fitSketch(ctx,320,380);renderSketch(ctx,sketch);
      const matrix=ctx.getTransform(),mouth=mouthBounds(sketch);
      const points=Array.from({length:478},()=>({x:.5,y:.5}));
      const place=(i,x,y)=>{const p=matrix.transformPoint({x,y});points[i]={x:p.x/640,y:p.y/480};};
      for(const [i,x,y] of [[33,320,474],[263,546,474],[13,mouth.x,mouth.y-8],[14,mouth.x,mouth.y+8],[152,433,785],[205,287,633],[425,579,633]])place(i,x,y);
      OUTER_LIP.slice(0,-1).forEach((id,i)=>{
        const a=Math.PI+i*Math.PI*2/(OUTER_LIP.length-1);
        place(id,mouth.x+Math.cos(a)*mouth.width/2,mouth.y+Math.sin(a)*mouth.height/2);
      });
      ctx.restore();
      ctx.fillStyle='#613f35';ctx.font='20px sans-serif';ctx.fillText('Test video '+Math.floor(time/1000)+' s',220,440);
      if(!FY.State.paused && !FY.State.intro){
        const cue=params.get('feedback')||'hold';
        FY.State.phaseGate={fill:cue==='hold'?.6:0,cue:cue==='ripple'?null:cue,cueSince:0};
        FY.State.lipRippleAt=cue==='ripple'?performance.now()-(time%480):null;
        FY.renderHoldProgress();
      }
      FY.State.lastLandmarks=[points];FY.State.lastFrameAt=performance.now();
      FY.drawCameraFeedback(document.getElementById('cameraFeedback'),document.getElementById('exerciseVideo'),[points]);
      requestAnimationFrame(paint);
    }
    paint(0);
    const stream=canvas.captureStream(24),video=document.getElementById('exerciseVideo');
    video.srcObject=stream;await video.play();
    document.getElementById('liveFaceHint').hidden=true;
    document.getElementById('sessionMode').textContent='Synthetic video · no camera';
    FY.setFaceView('camera');
    window.addEventListener('pagehide',()=>{stopped=true;stream.getTracks().forEach(t=>t.stop());},{once:true});
  }
  if(params.get('intro')==='1') FY.runDemo(move);
}
</script></body></html>
